name: CI Pipeline

on:
  # Temporarily manual-only while frontend/Ralph iteration is unstable.
  # Re-enable push / pull_request once the desktop build baseline is settled.
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check / Tests Baseline
      run: npm run test:ci

    - name: Desktop Type Check
      run: npm run desktop:typecheck

    - name: Desktop Build Baseline
      run: npm run desktop:build
