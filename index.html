<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPARK - The Economist Style Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fafafa;
      color: #18181b;
      margin: 0;
      overflow-x: hidden;
    }
    h1, h2, .font-serif {
      font-family: 'Playfair Display', serif;
    }
    
    /* Layout */
    .app-container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Sidebar */
    .sidebar {
      width: 80px;
      background: white;
      border-right: 1px solid #e4e4e7;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
      z-index: 20;
    }
    .logo {
      width: 40px;
      height: 40px;
      background: #4f46e5;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
      margin-bottom: 32px;
    }

    /* Main Area */
    .main-area {
      flex: 1;
      padding: 64px;
      overflow-y: auto;
      position: relative;
    }
    .textarea-wrapper {
      position: relative;
      margin-top: 32px;
    }
    textarea {
      width: 100%;
      height: 300px;
      padding: 24px;
      font-size: 1.25rem;
      line-height: 1.8;
      border: 1px solid #e4e4e7;
      border-radius: 16px;
      background: white;
      resize: none;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    textarea:focus {
      border-color: #a5b4fc;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .analyze-btn {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: #4f46e5;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
    }
    .analyze-btn:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }
    .analyze-btn:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
      transform: none;
    }

    /* Analysis Panel */
    .analysis-panel {
      width: 450px;
      background: white;
      border-left: 1px solid #e4e4e7;
      transform: translateX(100%);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 30px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      z-index: 30;
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
    }
    .analysis-panel.open {
      transform: translateX(0);
    }

    .panel-header {
      padding: 32px;
      border-bottom: 1px solid #f4f4f5;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .close-btn {
      background: #f4f4f5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover {
      background: #e4e4e7;
    }

    .panel-content {
      padding: 32px;
      overflow-y: auto;
      flex: 1;
    }

    /* Progress bars */
    .metric-bar-bg {
      width: 100%;
      height: 6px;
      background: #f4f4f5;
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
    }
    .metric-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
      width: 0%;
    }

    .loader {
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 2px solid white;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      display: none;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </script>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">T.</div>
      <div class="text-zinc-400 hover:text-indigo-600 cursor-pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-area">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-sm font-medium mb-8 border border-indigo-100">
        ✨ The Economist Style Engine
      </div>
      <h1 class="text-5xl font-medium mb-4 text-zinc-900 tracking-tight">Evaluate Your Academic Prose</h1>
      <p class="text-lg text-zinc-500 mb-8 font-serif">Paste your essay below and let SPARK analyze it against The Economist's editorial standards.</p>

      <div class="textarea-wrapper">
        <textarea id="editor" placeholder="Start typing or paste your English text here...">The university's draconian policies regarding dormitory curfews have sparked widespread backlash among the student body, many of whom argue that such archaic rules are incompatible with modern academic life. Therefore, the administration must reconsider its stance because a strict approach may ultimately suppress student engagement.</textarea>
        
        <button id="analyzeBtn" class="analyze-btn" onclick="handleAnalyze()">
          <span id="btnText">Analyze Style</span>
          <div id="loader" class="loader"></div>
          <svg id="btnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </div>
    </div>

    <!-- Analysis Panel -->
    <div id="analysisPanel" class="analysis-panel">
      <div class="panel-header">
        <div>
          <div class="text-xs font-mono tracking-widest uppercase text-zinc-400 mb-2">Style Report</div>
          <div id="reportTitle" class="text-3xl font-serif font-medium text-zinc-900">Economist Profile</div>
        </div>
        <button class="close-btn" onclick="closePanel()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div class="panel-content space-y-10">
        <div>
          <div class="flex items-end gap-4 mb-4">
            <div id="overallScore" class="text-6xl font-light tracking-tighter">0</div>
            <div class="text-zinc-400 font-mono text-sm pb-2">/ 100</div>
          </div>
          <p id="summaryText" class="text-zinc-600 leading-relaxed"></p>
        </div>

        <div>
          <h3 class="text-xs uppercase tracking-widest text-zinc-400 font-semibold mb-6">Metrics Breakdown</h3>
          <div id="metricsContainer" class="space-y-6">
            <!-- Metrics will be injected here -->
          </div>
        </div>

        <div id="suggestionsWrapper" style="display: none;">
          <h3 class="text-xs uppercase tracking-widest text-zinc-400 font-semibold mb-4">Actionable Suggestions</h3>
          <div id="suggestionsContainer" class="space-y-3">
            <!-- Suggestions will be injected here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const panel = document.getElementById('analysisPanel');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const editor = document.getElementById('editor');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const loader = document.getElementById('loader');

    function closePanel() {
      panel.classList.remove('open');
    }

    async function handleAnalyze() {
      const text = editor.value.trim();
      if (!text) return;

      // UI Loading state
      analyzeBtn.disabled = true;
      btnText.style.display = 'none';
      btnIcon.style.display = 'none';
      loader.style.display = 'block';

      try {
        const res = await fetch("http://127.0.0.1:4173/api/style/economist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        
        renderAnalysis(data);
        panel.classList.add('open');

      } catch (err) {
        alert("Error connecting to backend API. Make sure 'npm run web -- --port 4173' is running!");
        console.error(err);
      } finally {
        analyzeBtn.disabled = false;
        btnText.style.display = 'block';
        btnIcon.style.display = 'block';
        loader.style.display = 'none';
      }
    }

    function renderAnalysis(data) {
      document.getElementById('reportTitle').textContent = data.title;
      
      const scoreEl = document.getElementById('overallScore');
      scoreEl.textContent = data.overallScore;
      scoreEl.className = `text-6xl font-light tracking-tighter ${data.overallScore > 70 ? 'text-emerald-500' : data.overallScore > 40 ? 'text-amber-500' : 'text-rose-500'}`;
      
      document.getElementById('summaryText').textContent = data.summary;

      // Metrics
      const metricsContainer = document.getElementById('metricsContainer');
      metricsContainer.innerHTML = '';
      
      data.metrics.forEach(metric => {
        const colorClass = metric.score > 70 ? '#10b981' : metric.score > 40 ? '#f59e0b' : '#f43f5e';
        
        const metricHtml = `
          <div class="space-y-1">
            <div class="flex justify-between items-end">
              <span class="text-sm font-medium text-zinc-800">${metric.label}</span>
              <span class="text-xs font-mono text-zinc-500">${metric.score}%</span>
            </div>
            <div class="metric-bar-bg">
              <div class="metric-bar-fill" style="background: ${colorClass}"></div>
            </div>
            <p class="text-[11px] text-zinc-500 leading-tight pt-1">${metric.note}</p>
          </div>
        `;
        metricsContainer.insertAdjacentHTML('beforeend', metricHtml);
      });

      // Animate progress bars
      setTimeout(() => {
        const fills = metricsContainer.querySelectorAll('.metric-bar-fill');
        fills.forEach((fill, index) => {
          fill.style.width = `${data.metrics[index].score}%`;
        });
      }, 100);

      // Suggestions
      const suggestionsWrapper = document.getElementById('suggestionsWrapper');
      const suggestionsContainer = document.getElementById('suggestionsContainer');
      
      if (data.suggestions && data.suggestions.length > 0) {
        suggestionsWrapper.style.display = 'block';
        suggestionsContainer.innerHTML = '';
        data.suggestions.forEach(sug => {
          suggestionsContainer.insertAdjacentHTML('beforeend', `
            <div class="p-4 rounded-xl bg-zinc-50 border border-zinc-100">
              <div class="text-xs font-semibold text-zinc-800 mb-1">${sug.issue}</div>
              <div class="text-sm text-zinc-600">${sug.action}</div>
            </div>
          `);
        });
      } else {
        suggestionsWrapper.style.display = 'none';
      }
    }
  </script>
</body>
</html>
